# frontend/nginx.conf
#
# Serves the built React SPA on port 80. Any path not matching a real static
# file falls back to index.html so client-side routing (tab state, future
# React Router routes) works on a hard refresh or a direct link.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself is never
    # cached so a new deploy is picked up immediately.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
